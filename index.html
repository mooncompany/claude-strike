<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Claude Strike: Domestic Freedom Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script type="module">
import BootScene from './src/scenes/BootScene.js';
import MenuScene from './src/scenes/MenuScene.js';
import MissionScene from './src/scenes/MissionScene.js';
import UIScene from './src/scenes/UIScene.js';
import CutsceneScene from './src/scenes/CutsceneScene.js';
import DebriefScene from './src/scenes/DebriefScene.js';

const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 854,
  parent: document.body,
  backgroundColor: '#0a0c0a',
  pixelArt: true,
  physics: {
    default: 'arcade',
    arcade: {
      debug: false,
      gravity: { y: 0 }
    }
  },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [BootScene, MenuScene, MissionScene, UIScene, CutsceneScene, DebriefScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
